name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  review:
    name: review.sh (24 Product Module gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator dependencies
        run: python3 -m pip install -r pipeline/requirements.txt
      - name: Run gate suite
        run: bash pipeline/review.sh
